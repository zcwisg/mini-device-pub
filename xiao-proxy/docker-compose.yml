# ============================================
# xiao-proxy Docker 部署
# 构建: docker compose build
# 启动: docker compose up -d
# ============================================

services:
  xiao-proxy:
    build: .
    container_name: xiao-proxy
    restart: unless-stopped

    ports:
      - "3000:3000"

    # 挂载全部宿主机设备（ttyACM* 串口）
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro

    privileged: true

    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"